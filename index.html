<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efd9" />
    <meta
      name="description"
      content="Explore relativity in a sunlit village square with a clocktower and passing trams."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23fff1d2' stroke='%23688560' stroke-width='3'/%3E%3Cpath d='M32 14v18l12 8' fill='none' stroke='%23688560' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Clocktower Square · Relativity</title>
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-label="Relativity simulation" tabindex="0"></canvas>

      <div class="reticle" aria-hidden="true"><i></i><i></i></div>

      <header class="brand" aria-label="Relativity">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="18"></circle>
          <path d="M22 10v12l8 5M22 5v3M22 36v3M5 22h3M36 22h3"></path>
        </svg>
        <span>Relativity<small>Clocktower Square</small></span>
      </header>

      <section class="speed-gauge glass" aria-label="Player speed">
        <div class="gauge-heading"><span>v</span><strong id="player-speed">0.0</strong><small>u/s</small></div>
        <div class="gauge-track"><i id="player-speed-bar"></i><b id="light-limit-marker"></b></div>
        <div class="gauge-ratio"><span id="player-ratio">0.000 c</span><span id="gamma-readout">γ 1.000</span></div>
        <div class="movement-readout"><span id="movement-mode">WALKING</span><span id="altitude-readout">0.0 u ↑</span></div>
      </section>

      <section id="target-panel" class="target-panel glass" aria-live="polite" hidden>
        <div class="target-icon"><span id="target-arrow">↑</span></div>
        <div>
          <small id="target-name">OBJECT</small>
          <strong id="target-speed">0.0 <em>u/s</em></strong>
        </div>
        <div class="closing-meter"><i id="closing-meter-fill"></i></div>
      </section>

      <nav class="control-dock glass" aria-label="Simulation controls">
        <button id="pause-button" class="icon-button" type="button" aria-label="Pause simulation" aria-pressed="false">
          <span class="pause-icon">Ⅱ</span>
        </button>
        <button id="reset-button" class="icon-button" type="button" aria-label="Reset world">
          <span class="reset-icon">↺</span>
        </button>
        <div class="dock-divider"></div>
        <div class="light-control">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M14 7l5 5-5 5"></path><circle cx="5" cy="12" r="2"></circle></svg>
          <span>c</span>
          <input id="light-speed" type="range" min="6" max="40" step="0.5" value="12" aria-label="Speed of light" />
          <output id="light-speed-value" for="light-speed">12.0</output>
        </div>
        <div class="dock-divider"></div>
        <button id="compare-button" class="compare-button" type="button" aria-label="Compare classical and relativistic view" aria-pressed="false">
          <i></i><span>REL</span>
        </button>
      </nav>

      <button id="settings-button" class="settings-button glass" type="button" aria-label="Open settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm8 3.5-2.1-1.2.1-2.4-2.3-1.3-2 1.3L11.6 7 9.3 8.3l.1 2.4L7.2 12l2.1 1.2-.1 2.4 2.3 1.3 2-1.3 2.1 1.4 2.3-1.3-.1-2.4L20 12Z"></path></svg>
      </button>

      <aside id="settings-panel" class="settings-panel glass" aria-label="Settings" hidden>
        <div class="settings-title"><span>VIEW</span></div>
        <label class="toggle-row"><span>Doppler</span><input id="effect-doppler" type="checkbox" checked /><i></i></label>
        <label class="toggle-row"><span>Clocks</span><input id="effect-clocks" type="checkbox" checked /><i></i></label>
        <label class="toggle-row"><span>Contraction</span><input id="effect-contraction" type="checkbox" checked /><i></i></label>
        <label class="toggle-row"><span>Light delay</span><input id="effect-delay" type="checkbox" /><i></i></label>
        <label class="toggle-row"><span>Spacetime grid</span><input id="effect-grid" type="checkbox" /><i></i></label>
        <div class="settings-rule"></div>
        <label class="range-row"><span>FOV</span><output id="fov-output">72°</output><input id="fov-control" type="range" min="60" max="95" value="72" /></label>
        <label class="range-row"><span>Look</span><output id="sensitivity-output">1.0×</output><input id="sensitivity-control" type="range" min="0.4" max="1.8" step="0.1" value="1" /></label>
        <label class="toggle-row"><span>Reduced motion</span><input id="reduced-motion" type="checkbox" /><i></i></label>
        <label class="toggle-row"><span>Low distortion</span><input id="low-distortion" type="checkbox" /><i></i></label>
      </aside>

      <div id="start-screen" class="start-screen">
        <p class="start-eyebrow">Relativity · a place to wander</p>
        <h1>Clocktower<br />Square</h1>
        <p class="start-description">A little village. A different pace of time.</p>
        <button id="enter-button" type="button"><span>Take a stroll</span><i>→</i></button>
        <p class="start-controls">WASD to move &nbsp; · &nbsp; Mouse to look</p>
      </div>

      <div id="move-hint" class="control-hint move-hint" role="note" aria-label="WASD to move" hidden>
        <span class="movement-keys" aria-hidden="true">
          <kbd class="key-w">W</kbd>
          <kbd class="key-a">A</kbd><kbd class="key-s">S</kbd><kbd class="key-d">D</kbd>
        </span>
        <span aria-hidden="true">to move</span>
      </div>
      <div id="cursor-hint" class="control-hint cursor-hint" hidden><kbd>Esc</kbd><span>to show cursor</span></div>
      <div class="flight-hint">Space ×2 <span>fly / land</span><br />Space <span>up</span> &nbsp; Shift <span>down</span></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
